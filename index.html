<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://nour2030.neocities.org/DMS/Dorra.png">
    <link rel="manifest" href="manifest.json">

    <title>DMS - نظام إدارة الوثائق الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #1e40af; --secondary: #10b981; --danger: #ef4444; --warning: #f59e0b; --info: #8b5cf6; }
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; margin: 0; padding-bottom: 100px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        .app-card { background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.3); }
        .app-card:active { transform: scale(0.95); }
        
        .search-bar { transition: all 0.3s ease; border: 2px solid transparent; }
        .search-bar:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1); }

        .status-badge { padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 800; display: inline-block; }
        .bg-expired { background-color: #fee2e2; color: var(--danger); }
        .bg-warning { background-color: #fef3c7; color: var(--warning); }
        .bg-safe { background-color: #d1fae5; color: var(--secondary); }

        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 40; border-bottom: 1px solid #e2e8f0; padding-top: env(safe-area-inset-top); }

        .nav-item { position: relative; color: #94a3b8; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active::after { content: ''; position: absolute; top: -12px; width: 20px; height: 4px; background: var(--primary); border-radius: 0 0 10px 10px; }

        .screen { display: none; padding: 15px; max-width: 1200px; margin: 0 auto; }
        .screen.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div id="splash-screen" class="fixed inset-0 flex flex-col justify-center items-center text-white z-[100] transition-all duration-700 bg-slate-900">
    <img src="https://nour2030.neocities.org/DMS/Dorra.png" class="w-32 h-32 mb-6 animate-bounce" alt="Logo">
    <h1 class="text-2xl font-black">نظام إدارة الوثائق</h1>
    <p class="text-blue-400 mt-2 tracking-widest text-xs">SMART DMS (Haytham Nour)</p>
</div>

<div id="app-content" class="invisible">
    <header class="glass-header p-4">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-xl font-black text-slate-800">بوابة المستندات</h1>
                <p id="current-date" class="text-[10px] text-slate-500 font-bold"></p>
            </div>
            <img src="https://nour2030.neocities.org/DMS/Dorra.png" class="w-10 h-10 shadow-sm rounded-full" alt="Logo">
        </div>
        
        <div class="search-bar flex items-center bg-slate-100 rounded-2xl px-4 py-3">
            <i class="fas fa-search text-slate-400 ml-3"></i>
            <input type="text" id="smart-search" placeholder="ابحث عن شركة، ملف، أو مسؤول..." 
                   class="bg-transparent border-none outline-none w-full text-sm font-semibold text-slate-700"
                   onkeyup="handleSearch()">
        </div>
    </header>

    <div id="home-screen" class="screen active">
        <div class="grid grid-cols-3 gap-2 mb-6">
            <div class="app-card p-3 border-r-4 border-blue-600 bg-gradient-to-br from-white to-blue-50" onclick="openTab('loaned')">
                <i class="fas fa-folder-open text-blue-600 mb-2 text-lg"></i>
                <h3 class="text-[10px] font-bold text-slate-500">المستعارة</h3>
                <div class="text-xl font-black text-slate-800" id="count-loaned">0</div>
            </div>
            <div class="app-card p-3 border-r-4 border-emerald-600 bg-gradient-to-br from-white to-emerald-50" onclick="openTab('renewal')">
                <i class="fas fa-clock text-emerald-600 mb-2 text-lg"></i>
                <h3 class="text-[10px] font-bold text-slate-500">تجديدات</h3>
                <div class="text-xl font-black text-slate-800" id="count-renewal">0</div>
            </div>
            <div class="app-card p-3 border-r-4 border-purple-600 bg-gradient-to-br from-white to-purple-50" onclick="openTab('realestate')">
                <i class="fas fa-house-chimney text-purple-600 mb-2 text-lg"></i>
                <h3 class="text-[10px] font-bold text-slate-500">تمويل عقاري</h3>
                <div class="text-xl font-black text-slate-800" id="count-realestate">0</div>
            </div>
        </div>
        <h3 class="font-black text-slate-800 mb-4 flex items-center"><i class="fas fa-chart-line ml-2 text-blue-600"></i> وصول سريع</h3>
        <div class="space-y-3" id="quick-access"></div>
    </div>

    <div id="loaned-screen" class="screen">
        <h2 class="text-lg font-black mb-4 text-slate-800">قائمة الملفات المستعارة</h2>
        <div id="body-loaned" class="space-y-4"></div>
    </div>

    <div id="renewal-screen" class="screen">
        <h2 class="text-lg font-black mb-4 text-slate-800">جدول التجديدات</h2>
        <div id="body-renewal" class="space-y-4"></div>
    </div>

    <div id="realestate-screen" class="screen">
        <h2 class="text-lg font-black mb-4 text-slate-800">التمويل العقاري</h2>
        <div id="body-realestate" class="space-y-4"></div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 pb-6 flex justify-between items-center shadow-[0_-5px_20px_rgba(0,0,0,0.05)] z-50">
        <div onclick="openTab('home')" id="nav-home" class="nav-item active flex flex-col items-center">
            <i class="fas fa-th-large text-lg"></i>
            <span class="text-[9px] font-bold mt-1">الرئيسية</span>
        </div>
        <div onclick="openTab('loaned')" id="nav-loaned" class="nav-item flex flex-col items-center">
            <i class="fas fa-exchange-alt text-lg"></i>
            <span class="text-[9px] font-bold mt-1">المستعارة</span>
        </div>
        <div onclick="openTab('renewal')" id="nav-renewal" class="nav-item flex flex-col items-center">
            <i class="fas fa-calendar-alt text-lg"></i>
            <span class="text-[9px] font-bold mt-1">التجديدات</span>
        </div>
        <div onclick="openTab('realestate')" id="nav-realestate" class="nav-item flex flex-col items-center">
            <i class="fas fa-hand-holding-usd text-lg"></i>
            <span class="text-[9px] font-bold mt-1">تمويل عقاري</span>
        </div>
    </nav>
</div>

<script>
    // تسجيل السيرفس ووركر للعمل كموبايل ابلكيشن
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("Service Worker Registered"));
    }

    // نفس بياناتك البرمجية (Data)
    const loanedData = [
        { company: "ريجوا", file: "اصل عقد بيع الابتدائي 179 فدان", loanDate: "2021-5-26", borrower: "أ.حمادة ممدوح", phone: "201003430801" },
        // ... (بقية البيانات التي وضعتها في سؤالك)
    ];

    const renewalData = [
        { company: "فولاذ لخدمات الامن والحراسه", type: "شهادة القيمه المضافة", expiryDate: "2030-10-19", manager: "أ- عبد الناصر", phone: "201223615255" },
        // ... (بقية البيانات التي وضعتها في سؤالك)
    ];

    const realestateData = []; // يمكنك إضافة بيانات التمويل هنا

    // الدوال التشغيلية
    function initApp() {
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('opacity-0', 'invisible');
            document.getElementById('app-content').classList.remove('invisible');
            renderContent();
        }, 2000);
    }

    function renderContent() {
        // تحديث العدادات
        document.getElementById('count-loaned').innerText = loanedData.length;
        document.getElementById('count-renewal').innerText = renewalData.filter(d => new Date(d.expiryDate) < new Date()).length;

        // رندر البيانات (Logic)
        const loanedContainer = document.getElementById('body-loaned');
        loanedContainer.innerHTML = loanedData.map(item => `
            <div class="app-card p-4">
                <div class="flex justify-between items-start mb-2">
                    <span class="font-black text-slate-800">${item.company}</span>
                    <span class="text-[10px] text-slate-400">${item.loanDate}</span>
                </div>
                <p class="text-sm text-slate-600 mb-3">${item.file}</p>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-blue-600"><i class="fas fa-user ml-1"></i>${item.borrower}</span>
                    <a href="tel:${item.phone}" class="w-8 h-8 bg-green-500 text-white rounded-full flex items-center justify-center shadow-lg">
                        <i class="fas fa-phone-alt text-xs"></i>
                    </a>
                </div>
            </div>
        `).join('');
    }

    function openTab(tabId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId + '-screen').classList.add('active');
        document.getElementById('nav-' + tabId).classList.add('active');
        window.scrollTo(0,0);
    }

    window.onload = initApp;
</script>
</body>
</html>
